          required: true
          schema:
            description: Full URL of the pull/merge request to look up (e.g.
              `https://github.com/owner/repo/pull/123`).
            examples:
              - https://github.com/owner/repo/pull/123
            title: Pr Url
            type: string
        - description: Commit SHA to look up (full or short prefix). Defaults to the PR's
            current head commit when omitted.
          in: query
