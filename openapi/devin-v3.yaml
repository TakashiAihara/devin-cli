      properties:
        slack:
          anyOf:
            - $ref: "#/components/schemas/AutomationSessionSlackConfig"
            - type: "null"
          description: "Gives the session a Slack home: two-way for
            post_updates/forward_thread and post_response after its initial
            delivery binds the thread."
        teams:
          anyOf:
            - $ref: "#/components/schemas/AutomationSessionTeamsConfig"
            - type: "null"
          description: Posts the session's final response to the Microsoft Teams channel
            as a new top-level post, then binds its thread for replies
