          Returns ``400`` on an org-tier blueprint (those have no position).
        - ``source`` — switches the repo between ``git`` and ``database`` mode.
          Root repo-tier blueprints only. ``{"source": "database", "contents":
          ...}`` detaches with ``contents`` as the new (single) version.
        - ``build_on_default_branch_commit`` / ``report_check_runs`` — per-repo
          commit builds and their GitHub check runs. Root blueprints of
          github.com repos only.

