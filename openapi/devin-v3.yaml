          anyOf:
            - type: integer
            - type: "null"
          title: Max Acu Limit
        memory_enabled:
          anyOf:
            - type: boolean
            - type: "null"
          description: "Set to false to keep memory off for this session and its child
            sessions: it does not read or write memory, and memory does not
            learn from its transcript. Omit it, or set it to true, to follow the
            owner's memory settings; true does not turn on memory that those
            settings keep off."
          title: Memory Enabled
        platform:
          anyOf:
            - type: string
            - type: "null"
          description: Override the VM platform for the session (e.g. 'windows'), or the
            name of an outpost (BYOB) pool to run the session on one of your own
            machines. When omitted (or set to 'inherit'), a session created by a
            parent Devin inherits the parent's placement — both its platform and
            its outpost pool, so an outpost-placed parent spawns children on the
            same pool; otherwise the organization default is used. Any value
            must match either a platform configured for your organization or an
            outpost pool name (case-insensitive) — built-in platforms take
            priority when a name matches both, and a personal outpost pool owned
            by the caller takes priority over an account-wide pool with the same
            name. Unrecognized values are rejected with a 400 whose error body
            lists the available platform labels and outpost pool names for the
            org.
          title: Platform
