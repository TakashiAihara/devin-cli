            - snapshot_build:completed
            - board:ticket_updated
          title: Event Type
          type: string
        replies:
          default: []
          description: Where this trigger's session binds and its response is delivered.
            Only the matched trigger's replies execute, all entries
            independently; entries are deduplicated.
          items:
            $ref: "#/components/schemas/AutomationReply"
          title: Replies
          type: array
      required:
        - event_type
      title: AutomationTriggerRequest
      type: object
    AutomationTriggerResponse:
      additionalProperties: false
      properties:
        conditions:
          anyOf:
            - $ref: "#/components/schemas/AutomationConditions-Output"
            - type: "null"
        event_type:
          title: Event Type
          type: string
        replies:
          default: []
          items:
            $ref: "#/components/schemas/AutomationReply"
          title: Replies
          type: array
        trigger_id:
          description: Re-minted when triggers is replaced — not stable across edits.
          title: Trigger Id
          type: string
        webhook:
          anyOf:
            - $ref: "#/components/schemas/AutomationWebhookResponse"
            - type: "null"
          description: Only on webhook:incoming triggers.
      required:
        - trigger_id
        - event_type
      title: AutomationTriggerResponse
      type: object
    AutomationUpdateRequest:
      additionalProperties: false
      description: >-
        PATCH fields merge member-wise by default: omitted members are kept,

        explicit nulls clear, and empty groups are no-ops. Metadata merges per
        key,

        with null values deleting keys. Lists replace wholesale (deletion =
        resend

        the list without the element), while each sent element merges onto the

        stored element of the same type when that type occurs exactly once on
        both

        sides. Element members that are required on create (``prompt``,

        ``setup_prompt``, the monitor/triage slack configs, ``scan_id``) may be

        omitted when a counterpart exists — they carry like any other member;

        explicit null is rejected.
      properties:
        actions:
          anyOf:
            - items:
                discriminator:
                  mapping:
                    message_session: "#/components/schemas/AutomationMessageSessionActionUpdate"
                    monitor_session: "#/components/schemas/AutomationMonitorSessionActionUpdate"
                    start_session: "#/components/schemas/AutomationStartSessionActionUpdate"
                  propertyName: type
                oneOf:
                  - $ref: "#/components/schemas/AutomationStartSessionActionUpdate"
                  - $ref: "#/components/schemas/AutomationMessageSessionActionUpdate"
                  - $ref: "#/components/schemas/AutomationMonitorSessionActionUpdate"
              type: array
            - type: "null"
          title: Actions
        concurrency:
          anyOf:
            - $ref: "#/components/schemas/AutomationConcurrency"
            - type: "null"
        enabled:
          anyOf:
            - type: boolean
            - type: "null"
          title: Enabled
        limits:
          anyOf:
            - $ref: "#/components/schemas/AutomationLimits"
            - type: "null"
        llm_check:
          $ref: "#/components/schemas/AutomationLlmCheckRequest"
          description: Replace the automation's LLM check (filter prompt and enabled
            state). Omitted keeps the current one; null is rejected, disable it
            with enabled=false instead.
          title: Llm Check
        metadata:
          anyOf:
            - additionalProperties:
                anyOf:
                  - type: string
                  - type: "null"
              type: object
            - type: "null"
          title: Metadata
        name:
          anyOf:
            - maxLength: 500
              minLength: 1
              type: string
            - type: "null"
          title: Name
        notifications:
          anyOf:
            - $ref: "#/components/schemas/AutomationNotifications"
            - type: "null"
        run_as:
          anyOf:
            - description: "Identity the spawned sessions run under. organization: the org's
                automation identity. When the organization has a default service
                user for automations, sessions run as that service user and the
                response returns run_as service_user with its id; saving
                requires every permission that service user holds. Otherwise it
                is the System User in the app — sessions use system permissions,
                so MCP servers installed with a personal (user-scoped)
                connection cannot be selected, and switching an automation to
                organization removes them from its selection. creator: personal
                automation — runs with the creator's own permissions and is
                visible only to the creator and org admins; rejected for
                service-user-created automations. service_user: runs as the
                given service user, with its roles, grants and ACU limits;
                requires permission to manage that service user. Required on
                create; null on update resets to organization."
              discriminator:
                mapping:
                  creator: "#/components/schemas/AutomationRunAsCreator"
                  organization: "#/components/schemas/AutomationRunAsOrganization"
                  service_user: "#/components/schemas/AutomationRunAsServiceUser"
                propertyName: type
              oneOf:
                - $ref: "#/components/schemas/AutomationRunAsOrganization"
                - $ref: "#/components/schemas/AutomationRunAsCreator"
                - $ref: "#/components/schemas/AutomationRunAsServiceUser"
            - type: "null"
          description: null resets to organization.
          title: Run As
        script_check:
          $ref: "#/components/schemas/AutomationScriptCheckRequest"
          description: Replace the automation's script Preflight check (script, runtime,
            timeout, secrets, enabled state). Omitted keeps the current one;
            null is rejected, disable it with enabled=false instead.
          title: Script Check
        security_profile:
          anyOf:
            - $ref: "#/components/schemas/AutomationSecurityProfileSelection"
            - type: "null"
          description: "The automation's own security-profile binding: a profile_id pins
            that profile, {\"profile_id\": null} records an explicit opt-out,
            and explicit null reverts to inheriting from the org/enterprise.
            Requires the security-profile management permission."
        session_settings:
          anyOf:
            - $ref: "#/components/schemas/AutomationSessionSettings-Input"
            - type: "null"
        slack_reply_access:
          anyOf:
            - enum:
                - devin_users
                - slack_users
                - external_slack_users
              type: string
            - type: "null"
          description: null resets to slack_users.
          title: Slack Reply Access
        teams_reply_access:
          anyOf:
            - enum:
                - devin_users
                - teams_users
              type: string
            - type: "null"
          description: null resets to teams_users.
          title: Teams Reply Access
        tools:
          anyOf:
            - $ref: "#/components/schemas/AutomationTools"
            - type: "null"
        triggers:
          anyOf:
            - items:
                $ref: "#/components/schemas/AutomationTriggerRequest-Input"
              type: array
            - type: "null"
          title: Triggers
      title: AutomationUpdateRequest
      type: object
    AutomationWebhookResponse:
      additionalProperties: false
      properties:
        secret:
          anyOf:
            - type: string
            - type: "null"
          description: Present only when newly minted (create or re-add); never
            retrievable again. Replacing triggers preserves the existing secret.
          title: Secret
        url:
          description: The inbox external systems POST to (header X-Webhook-Secret).
          title: Url
          type: string
      required:
        - url
      title: AutomationWebhookResponse
      type: object
    Blueprint:
