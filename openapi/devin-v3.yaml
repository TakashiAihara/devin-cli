  /v3/enterprise/consumption/daily:
    get:
      tags:
        - consumption
      summary: Get Daily Consumption
      description: >-
        Get daily ACU consumption for the entire enterprise.


        Returns total ACUs and consumption broken down by date.


        **Timezone behavior**: Billing cycles use midnight PST (Pacific Standard
        Time)

        as the day boundary, which corresponds to 08:00:00 UTC. To match the
        consumption

        data shown in the Devin dashboard, pass Unix timestamps that align with
        this

        timezone offset (e.g., 1733385600 for December 5, 2025 at midnight PST).
      operationId: getEnterpriseConsumptionDaily
      parameters:
        - in: query
          name: time_before
          required: false
          schema:
            anyOf:
              - type: integer
              - type: "null"
            title: Time Before
        - in: query
          name: time_after
          required: false
          schema:
            anyOf:
              - type: integer
              - type: "null"
            title: Time After
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsumptionResponse"
