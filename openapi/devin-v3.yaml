          description: Override the Devin agent mode for the session. 'normal' uses the
            default Agent mode, 'fast' uses Fast mode, 'lite' uses Devin Lite,
            'ultra' uses Devin Ultra, and 'fusion' uses Fusion. The other values
            select the agent mode of the same name in the web app. Preview modes
            are subject to the same feature flag and enterprise agent preview
            restrictions as the web app.
          title: Devin Mode
        knowledge_ids:
          anyOf:
            - items:
                type: string
              type: array
            - type: "null"
          title: Knowledge Ids
