    StartIngestionScanRequest:
      description: |-
        Request body for starting an ingestion-mode code scan.

        Only accepts an ingestion (ingest-mode) scan profile: the profile is run
        against the given repository (or repositories).
      properties:
        attachment_urls:
          anyOf:
            - items:
                format: uri
                maxLength: 2083
                minLength: 1
                type: string
              maxItems: 10
              type: array
            - type: "null"
          description: Devin attachment URLs to provide to the scan, e.g. files uploaded
            via the attachments API. The attachments must belong to the
            organization being scanned.
          title: Attachment Urls
        effort:
          anyOf:
            - enum:
                - normal
                - deep
              type: string
            - type: "null"
          description: "Scan effort: 'normal' (default) uses lower model reasoning effort
            with larger triage and validation batches; 'deep' runs the full
            pipeline."
          title: Effort
        host:
          anyOf:
            - type: string
            - type: "null"
          description: Git host of the repository, if known.
          title: Host
        platform:
          anyOf:
            - maxLength: 128
              type: string
            - type: "null"
          description: "Where the scan's sessions run: a platform label configured for the
            organization (e.g. 'linux', 'windows', 'macos') or the name of an
            outpost (BYOB) pool, case-insensitive; platforms take priority when
            a name matches both. Omitted means the organization default.
            Unrecognized values are rejected with a 400 whose error body lists
            the available platform labels and outpost pool names."
          title: Platform
        profile_id:
          description: Ingestion-mode scan profile to run. Must be an ingest profile;
            non-ingest profiles are rejected with 400.
          title: Profile Id
          type: string
        repo_name:
          anyOf:
            - type: string
            - type: "null"
          description: Full name of the repository to scan. Provide exactly one of
            repo_name or repos.
          title: Repo Name
        repos:
          anyOf:
            - items:
                $ref: "#/components/schemas/ScanRepoRequest"
              maxItems: 500
              type: array
            - type: "null"
          description: Repositories covered by one scan; the first entry is the scan's
            primary repository. Provide exactly one of repo_name or repos.
          title: Repos
      required:
        - profile_id
      title: StartIngestionScanRequest
      type: object
