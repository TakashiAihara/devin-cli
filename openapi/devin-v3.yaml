  /v3/organizations/{org_id}/automations:
    get:
      tags:
        - automations
      summary: List automations
      description: |-
        List all automations for the organization, newest first.

        Supports `metadata.<key>=<value>` query parameters to filter on
        metadata labels (exact match; multiple filters AND together).

        `agent_types` filters to automations containing at least one action of a
        given agent type; repeat the parameter to match any of several types
        (OR). Action payloads live in customer-data storage rather than
        queryable columns, so this filter scans pages server-side. `total` is
        only returned when a single unfiltered scan covered the whole result set
        (first page, no further pages, nothing hidden); otherwise it is omitted
        rather than reporting a count that includes automations the API will
        never return.
      operationId: getOrganizationsOrgIdAutomations
      parameters:
        - description: "Organization ID (prefix: org-)"
          in: path
          name: org_id
          required: true
          schema:
            example: org-abc123def456
            title: Org Id
            type: string
        - in: query
          name: after
          required: false
          schema:
            anyOf:
              - type: string
              - type: "null"
            title: After
        - in: query
          name: first
          required: false
          schema:
            default: 100
            maximum: 200
            minimum: 1
            title: First
            type: integer
        - in: query
          name: search
          required: false
          schema:
            anyOf:
              - type: string
              - type: "null"
            title: Search
        - in: query
          name: creator_id
          required: false
          schema:
            anyOf:
              - type: string
              - type: "null"
            title: Creator Id
        - in: query
          name: enabled
          required: false
          schema:
            anyOf:
              - type: boolean
              - type: "null"
            title: Enabled
        - in: query
          name: event_type
          required: false
          schema:
            anyOf:
              - type: string
              - type: "null"
            title: Event Type
        - in: query
          name: agent_types
          required: false
          schema:
            anyOf:
              - items:
                  enum:
                    - new_session
                    - long_running
                    - auto_triage
                    - remediate_finding
                    - triage_session
                    - generic_assistant
                    - incident_session
                    - code_scan
                  type: string
                type: array
              - type: "null"
            title: Agent Types
