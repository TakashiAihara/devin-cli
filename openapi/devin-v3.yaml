      title: AutomationSessionNotificationsConfig
      type: object
    AutomationSessionSettings-Input:
      additionalProperties: false
      description: |-
        Applied to every session this automation spawns (including monitor
        sessions).
      properties:
        devin_mode:
          anyOf:
            - type: string
            - type: "null"
          description: null = org default. One of normal, fast, lite, ultra, fusion, or a
            research preview the organization can use (see
            schemas.available_devin_modes). Research previews require
            fallback_devin_mode; a stored preview the organization can no longer
            use stays stored (unrelated edits preserve it) and its sessions
            start on fallback_devin_mode.
          title: Devin Mode
        fallback_devin_mode:
          anyOf:
            - enum:
                - normal
                - fast
                - lite
                - ultra
                - fusion
              type: string
            - type: "null"
          description: Stable mode sessions start in when devin_mode is a research preview
            that is unavailable at run time. Required with a preview devin_mode
            (see schemas.default_fallback_devin_mode), rejected with a stable or
            null devin_mode; cleared with devin_mode.
          title: Fallback Devin Mode
        net_policy:
          anyOf:
            - $ref: "#/components/schemas/AutomationNetPolicy"
            - type: "null"
      title: AutomationSessionSettings
      type: object
    AutomationSessionSettings-Output:
      additionalProperties: false
