          description: Devin attachment URL of the file.
          title: Url
          type: string
      required:
        - url
        - filename
      title: CodeScanAttachmentResponse
      type: object
    CodeScanCreateRequest:
      description: Request body for starting a new code scan.
      properties:
        commit_sha:
          anyOf:
            - type: string
            - type: "null"
          description: Commit to check out before scanning.
          title: Commit Sha
        devin_mode:
          anyOf:
            - enum:
                - fusion
                - swe-2
              type: string
            - type: "null"
          description: "Agent the scan's sessions run on: 'fusion' or 'swe-2' (SWE-2 Max
            for 'deep' effort, SWE-2 High for 'normal'). Applies only when the
            mode is enabled for the organization; otherwise, and when omitted,
            the scan runs on the default agent."
          title: Devin Mode
        effort:
          anyOf:
            - enum:
                - normal
                - deep
              type: string
            - type: "null"
          description: "Scan effort: 'normal' (default) uses lower model reasoning effort
            with larger investigation batches; 'deep' runs the full pipeline."
          title: Effort
        host:
          anyOf:
            - type: string
            - type: "null"
          description: Git host of the repository, if known.
          title: Host
        interactive:
          default: false
          description: When true, the scan pauses for user review between threat modeling
            and investigation.
          title: Interactive
          type: boolean
        locale:
          anyOf:
            - type: string
            - type: "null"
          description: "BCP-47 language tag (e.g. 'ja') for the scan's user-facing output:
            finding titles, descriptions, and reports. Omitted means English."
          title: Locale
        platform:
          anyOf:
            - maxLength: 128
              type: string
            - type: "null"
          description: "Where the scan's sessions run: a platform label configured for the
            organization (e.g. 'linux', 'windows', 'macos') or the name of an
            outpost (BYOB) pool, case-insensitive; platforms take priority when
            a name matches both. Omitted means the organization default.
            Unrecognized values are rejected with a 400 whose error body lists
            the available platform labels and outpost pool names."
          title: Platform
        profile_id:
          anyOf:
            - type: string
            - type: "null"
          description: Scan profile to apply to the scan.
          title: Profile Id
        repo_name:
          anyOf:
            - type: string
            - type: "null"
          description: Full name of the repository to scan. Provide exactly one of
            repo_name or repos.
          title: Repo Name
        repos:
          anyOf:
            - items:
                $ref: "#/components/schemas/ScanRepoRequest"
              maxItems: 500
              type: array
            - type: "null"
          description: Repositories covered by one scan; the first entry is the scan's
            primary repository. Provide exactly one of repo_name or repos.
          title: Repos
        scan_type:
          anyOf:
            - enum:
                - security
                - performance
                - db-queries
                - test-coverage
                - dead-code
                - code-quality
                - cleanup
                - telemetry
                - accessibility
                - compliance
                - general
                - migration-docs
              type: string
            - type: "null"
          description: Type of scan to run. Must match the profile's scan type when a
            profile is given; defaults to the profile's type, or 'security' for
            profile-less scans. Non-security types require a profile and are
            rejected without one.
          title: Scan Type
      title: CodeScanCreateRequest
      type: object
    CodeScanFindingResponse:
      description: A single code scan finding.
      properties:
        category:
          anyOf:
            - type: string
            - type: "null"
          description: Category (rule name) the finding was classified under, if any.
          title: Category
        code_owners:
          description: Code owners associated with the affected code.
          items:
            type: string
          title: Code Owners
          type: array
        code_scan_run_id:
          anyOf:
            - type: string
            - type: "null"
          description: Identifier of the scan run that produced the finding, if known.
          title: Code Scan Run Id
        created_at:
          description: When the finding was created (unix seconds).
          title: Created At
          type: integer
        description:
          anyOf:
            - type: string
            - type: "null"
          description: Detailed description of the vulnerability, if any.
          title: Description
        dismissal_reason:
          anyOf:
            - type: string
            - type: "null"
          description: Why the finding was dismissed (e.g. duplicate, false_positive), if
            it is dismissed and a reason was recorded.
          title: Dismissal Reason
        finding_id:
          description: Unique identifier for the finding.
          title: Finding Id
          type: string
        fix_effort:
          anyOf:
            - enum:
                - small
                - large
              type: string
            - type: "null"
          description: "Size of the fix as rated by the scan: small or large. Null when
            the finding has not been rated."
          title: Fix Effort
        note:
          anyOf:
            - type: string
            - type: "null"
          description: Additional note attached to the finding, if any.
          title: Note
        orchestrator_session_id:
          anyOf:
            - type: string
            - type: "null"
          description: Orchestrator session that ran the scan that produced the finding
            (the scan's Devin session), if any.
          title: Orchestrator Session Id
        payoff:
          anyOf:
            - enum:
                - quick_win
                - big_fix
                - easy_fix
                - deprioritize
              type: string
            - type: "null"
          description: "Severity x fix_effort quadrant: quick_win (critical/high, small
            fix), big_fix (critical/high, large fix), easy_fix (medium/low,
            small fix), deprioritize (medium/low, large fix). Null when
            unrated."
          title: Payoff
        pr_url:
          anyOf:
            - type: string
            - type: "null"
          description: URL of the remediation PR opened for this finding, if any.
          title: Pr Url
        recommendation:
          anyOf:
            - type: string
            - type: "null"
          description: Suggested remediation for the finding, if any.
          title: Recommendation
        reference_snippets:
          description: Code snippets referenced by the finding as supporting evidence.
          items:
            $ref: "#/components/schemas/CodeScanReferenceSnippetResponse"
          title: Reference Snippets
          type: array
        related_finding_ids:
          description: Finding IDs of the other links in a realized attack chain. Set only
            on the chain's sink finding.
          items:
            type: string
          title: Related Finding Ids
          type: array
        repo_name:
          description: Repository the finding was reported in.
          title: Repo Name
          type: string
        scan_id:
          description: Identifier of the scan that produced the finding.
          title: Scan Id
          type: string
        session_id:
          anyOf:
            - type: string
            - type: "null"
          description: Session that remediated the finding (and opened the PR), if any.
          title: Session Id
        severity:
          description: "Severity of the finding: critical, high, medium, or low."
          enum:
            - critical
            - high
            - medium
            - low
          title: Severity
          type: string
        status:
          description: "Finding status: open, dismissed, or resolved."
          enum:
            - open
            - dismissed
            - resolved
          title: Status
          type: string
        title:
          anyOf:
            - type: string
            - type: "null"
          description: Title of the finding, if any.
          title: Title
        updated_at:
          description: When the finding was last updated (unix seconds).
          title: Updated At
          type: integer
        validation_artifacts:
          description: Attachment URLs recorded by runtime validation.
          items:
            type: string
          title: Validation Artifacts
          type: array
        validation_evidence:
          anyOf:
            - type: string
            - type: "null"
          description: Evidence summary recorded by runtime validation, if any.
          title: Validation Evidence
        validation_result:
          anyOf:
            - enum:
                - confirmed
                - false_positive
                - inconclusive
              type: string
            - type: "null"
          description: "Recorded runtime validation outcome, if any: confirmed,
            false_positive, or inconclusive."
          title: Validation Result
        validation_session_id:
          anyOf:
            - type: string
            - type: "null"
          description: Session that recorded the runtime validation outcome, if any.
          title: Validation Session Id
      required:
        - finding_id
        - title
        - description
        - recommendation
        - note
        - code_owners
        - reference_snippets
        - severity
        - category
        - repo_name
        - pr_url
        - scan_id
        - code_scan_run_id
        - session_id
        - orchestrator_session_id
        - status
        - created_at
        - updated_at
      title: CodeScanFindingResponse
      type: object
    CodeScanMetricsResponse:
