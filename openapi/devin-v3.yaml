          title: Communication Guidance
        created_at:
          description: When the profile was created (unix seconds).
          title: Created At
          type: integer
        description:
          anyOf:
            - type: string
            - type: "null"
          description: Description of the profile, if any.
          title: Description
        exclude_globs:
          anyOf:
            - items:
                type: string
              type: array
            - type: "null"
          description: Glob patterns of files to exclude from the scan, if any.
          title: Exclude Globs
        include_globs:
          anyOf:
