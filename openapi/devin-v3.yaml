  /v3/enterprise/code-scans/findings:
    get:
      tags:
        - code-scans
      summary: List Code Scan Findings
      description: >-
        List code scan findings for the enterprise account.


        Findings are returned newest first. Optionally filter by ``org_ids``,

        ``scan_id``, ``repo_name``, ``severity``, ``status``, ``payoff``, and

        created/updated timestamp bounds (``created_after``/``created_before``,

        ``updated_after``/``updated_before``). Results are paginated with an
        opaque

        cursor (``after`` / ``first``).
      operationId: getEnterpriseCodeScansFindings
      parameters:
        - in: query
          name: after
          required: false
          schema:
            anyOf:
              - type: string
              - type: "null"
            title: After
        - in: query
          name: first
          required: false
          schema:
            default: 100
            maximum: 200
            minimum: 1
            title: First
            type: integer
        - description: Text search over finding title, description, and file path.
            Combines with other filters such as repo_name. Blank means no
            search. Returns 503 when search is unavailable for an organization.
          in: query
          name: q
          required: false
          schema:
            anyOf:
              - maxLength: 200
                type: string
              - type: "null"
            description: Text search over finding title, description, and file path.
              Combines with other filters such as repo_name. Blank means no
              search. Returns 503 when search is unavailable for an
              organization.
            title: Q
        - description: Filter to findings produced by this scan.
          in: query
          name: scan_id
          required: false
          schema:
            anyOf:
              - type: string
              - type: "null"
            description: Filter to findings produced by this scan.
            title: Scan Id
        - description: Filter to findings reported in this repository.
          in: query
          name: repo_name
          required: false
          schema:
            anyOf:
              - type: string
              - type: "null"
            description: Filter to findings reported in this repository.
            title: Repo Name
        - description: Filter to findings with any of these severities (critical, high,
            medium, low).
          in: query
          name: severity
          required: false
          schema:
            anyOf:
              - items:
                  enum:
                    - critical
                    - high
                    - medium
                    - low
                  type: string
                type: array
              - type: "null"
            description: Filter to findings with any of these severities (critical, high,
              medium, low).
            title: Severity
        - description: Filter to findings with any of these statuses (open, dismissed,
            resolved).
          in: query
          name: status
          required: false
          schema:
            anyOf:
              - items:
                  enum:
                    - open
                    - dismissed
                    - resolved
                  type: string
                type: array
              - type: "null"
            description: Filter to findings with any of these statuses (open, dismissed,
              resolved).
            title: Status
        - description: Filter to findings in any of these payoff quadrants (quick_win,
            big_fix, easy_fix, deprioritize). Unrated findings (null fix_effort)
            never match.
          in: query
          name: payoff
          required: false
          schema:
            anyOf:
              - items:
                  enum:
                    - quick_win
                    - big_fix
                    - easy_fix
                    - deprioritize
                  type: string
                maxItems: 4
                type: array
              - type: "null"
            description: Filter to findings in any of these payoff quadrants (quick_win,
              big_fix, easy_fix, deprioritize). Unrated findings (null
              fix_effort) never match.
            title: Payoff
        - description: Findings created at or after this unix timestamp (seconds).
          in: query
          name: created_after
          required: false
          schema:
            anyOf:
              - type: integer
              - type: "null"
            description: Findings created at or after this unix timestamp (seconds).
            title: Created After
        - description: Findings created at or before this unix timestamp (seconds).
          in: query
          name: created_before
          required: false
          schema:
            anyOf:
              - type: integer
              - type: "null"
            description: Findings created at or before this unix timestamp (seconds).
            title: Created Before
        - description: Findings updated at or after this unix timestamp (seconds).
          in: query
          name: updated_after
          required: false
          schema:
            anyOf:
              - type: integer
              - type: "null"
            description: Findings updated at or after this unix timestamp (seconds).
            title: Updated After
        - description: Findings updated at or before this unix timestamp (seconds).
          in: query
          name: updated_before
          required: false
          schema:
            anyOf:
              - type: integer
              - type: "null"
            description: Findings updated at or before this unix timestamp (seconds).
            title: Updated Before
        - description: Filter to findings in these organizations.
          in: query
          name: org_ids
          required: false
          schema:
            anyOf:
              - items:
                  type: string
                type: array
              - type: "null"
            description: Filter to findings in these organizations.
            title: Org Ids
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedResponse_CodeScanFindingResponse_"
