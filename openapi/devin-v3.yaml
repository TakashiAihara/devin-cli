    EnterpriseSecurityProfileResponse:
      additionalProperties: false
      description: |-
        An enterprise-owned security profile, shared with every org in the
        enterprise. The owning enterprise is implied by the caller's token.
      properties:
        created_at:
          title: Created At
          type: integer
        devin_mcp_read_only:
          description: When true, sessions may only call read-only Devin MCP tools (no
            session creation, automation management, or other write operations).
          title: Devin Mcp Read Only
          type: boolean
        enforcement_level:
          description: recommended profiles can be overridden by descendant bindings;
            mandatory profiles are a floor that descendant policies only narrow.
          enum:
            - recommended
            - mandatory
          title: Enforcement Level
          type: string
        git_access_level:
          enum:
            - read_only
            - read_write
          title: Git Access Level
          type: string
        mcp_config:
          anyOf:
            - $ref: "#/components/schemas/SecurityProfileMcpConfig"
            - type: "null"
          description: null = this profile has no MCP opinion.
        name:
          title: Name
          type: string
        net_policy:
          anyOf:
            - $ref: "#/components/schemas/SecurityProfileNetPolicy"
            - type: "null"
          description: null = this profile has no network opinion (it does NOT mean
            deny-all).
        profile_id:
          description: The security profile's ID.
          title: Profile Id
          type: string
        remove_github_cli_token:
          description: When true, the GitHub CLI token is removed from the session's
            machine, preventing direct GitHub API access.
          title: Remove Github Cli Token
          type: boolean
        slack_channel_access:
          anyOf:
            - $ref: "#/components/schemas/SecurityProfileSlackChannelAccess"
            - type: "null"
          description: Ceiling on the Slack channels sessions governed by this profile may
            read and post in. null = this profile has no opinion and the
            organization's Slack setting applies.
        slack_dm_scope:
          anyOf:
            - enum:
                - disabled
                - org_members
                - workspace
              type: string
            - type: "null"
          description: Ceiling on who may DM Devin in Slack under this profile. null =
            this profile has no opinion and the organization's Slack setting
            applies. 'workspace' is narrowed to 'org_members' for enterprise
            accounts.
          title: Slack Dm Scope
        teams_channel_access:
          anyOf:
            - $ref: "#/components/schemas/SecurityProfileTeamsChannelAccess"
            - type: "null"
          description: Ceiling on the Microsoft Teams channels sessions governed by this
            profile may read and post in. null = this profile has no opinion and
            the organization's Teams Default Access applies.
        teams_dm_scope:
          anyOf:
            - enum:
                - disabled
                - installed_users
              type: string
            - type: "null"
          description: Ceiling on who Devin may DM in Microsoft Teams under this profile.
            null = this profile has no opinion and the organization's Teams
            Default Access applies.
          title: Teams Dm Scope
        teams_group_chat_scope:
          anyOf:
            - enum:
                - disabled
                - origin_chat
              type: string
            - type: "null"
          description: Ceiling on which Teams group chats Devin may read under this
            profile; `origin_chat` = only the group chat the session was started
            from; null = no opinion, derived from the org's Teams Default Access
            like DMs.
          title: Teams Group Chat Scope
        updated_at:
          title: Updated At
          type: integer
      required:
        - profile_id
        - name
        - git_access_level
        - enforcement_level
        - devin_mcp_read_only
        - remove_github_cli_token
        - created_at
        - updated_at
      title: EnterpriseSecurityProfileResponse
      type: object
