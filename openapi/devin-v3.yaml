          description: New YAML body for the blueprint.
          title: Contents
          type: string
      required:
        - contents
      title: UpdateBlueprintContentsBody
      type: object
    UpdateOrgBlueprintBody:
      description: >-
        Partial update for an org- or repo-tier blueprint.


        Any subset of fields may be provided. Fields not set are left alone.

        Providing ``position``, ``source`` or a commit-build setting on an

        org-tier blueprint returns ``400`` — only repo-tier blueprints have
        them.

        Does NOT trigger a build.
      properties:
        build_on_default_branch_commit:
          anyOf:
            - type: boolean
            - type: "null"
          description: If set, turns building the environment on each push to the default
            branch on or off. Only accepted on the root blueprint of a
            github.com repo. Every such push queues a build.
          title: Build On Default Branch Commit
        contents:
          anyOf:
            - type: string
            - type: "null"
          description: If set, replaces the blueprint's YAML body with a new version.
          title: Contents
        position:
          anyOf:
            - type: integer
            - type: "null"
          description: If set, updates the execution position of this repo-tier blueprint.
            Positions are not required to be unique; ties are broken arbitrarily
            by the server when sorting for execution.
          title: Position
        report_check_runs:
          anyOf:
            - type: boolean
            - type: "null"
          description: If set, turns reporting each commit build as a GitHub check run on
            or off. Enabling it requires 'build_on_default_branch_commit' to be
            on.
          title: Report Check Runs
        source:
          anyOf:
            - enum:
                - git
                - database
              type: string
            - type: "null"
          description: If set, switches the repo's blueprint source. Only accepted on the
            repo's root blueprint (scoped blueprints inherit it). 'git' pulls
            .devin/blueprint.yaml from the default branch (404 if absent) and
            cannot be combined with 'contents'; 'database' keeps the current
            YAML (or 'contents', if given) and stops syncing from the repo.
            No-op when the blueprint is already in that mode.
          title: Source
      title: UpdateOrgBlueprintBody
      type: object
