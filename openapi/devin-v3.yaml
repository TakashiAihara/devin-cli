  /v3/enterprise/code-scans/scans:
    get:
      tags:
        - code-scans
      summary: List Code Scans
      description: |-
        List code scans for the enterprise account.

        Scans are returned newest first. Optionally filter by ``org_ids``,
        ``repo_name``, and creation time (``time_after`` / ``time_before``);
        results are paginated with an opaque cursor (``after`` / ``first``).
      operationId: getEnterpriseCodeScansScans
      parameters:
        - in: query
          name: time_before
          required: false
          schema:
            anyOf:
              - type: integer
              - type: "null"
            title: Time Before
        - in: query
          name: time_after
          required: false
          schema:
            anyOf:
              - type: integer
              - type: "null"
            title: Time After
        - in: query
          name: after
          required: false
          schema:
            anyOf:
              - type: string
              - type: "null"
            title: After
        - in: query
          name: first
          required: false
          schema:
            default: 100
            maximum: 200
            minimum: 1
            title: First
            type: integer
        - description: Filter to scans of this scan type.
          in: query
          name: scan_type
          required: false
          schema:
            anyOf:
              - enum:
                  - security
                  - performance
                  - db-queries
                  - test-coverage
                  - dead-code
                  - code-quality
                  - cleanup
                  - telemetry
                  - accessibility
                  - compliance
                  - general
                  - migration-docs
                type: string
              - type: "null"
            description: Filter to scans of this scan type.
            title: Scan Type
        - description: Filter to scans that scanned this repository. Matches multi-repo
            scans even when the repository is not the scan's primary repo, so
            returned items may report a different repo_name.
          in: query
          name: repo_name
          required: false
          schema:
            anyOf:
              - type: string
              - type: "null"
            description: Filter to scans that scanned this repository. Matches multi-repo
              scans even when the repository is not the scan's primary repo, so
              returned items may report a different repo_name.
            title: Repo Name
        - description: Filter to scans in these organizations.
          in: query
          name: org_ids
          required: false
          schema:
            anyOf:
              - items:
                  type: string
                type: array
              - type: "null"
            description: Filter to scans in these organizations.
            title: Org Ids
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedResponse_CodeScanResponse_"
          description: Successful Response
