        script_check_available:
          default: false
          description: Whether this organization can configure a script Preflight check
            (the automation-code-step rollout). When false the script_check
            field is rejected with 403.
          title: Script Check Available
          type: boolean
        security_profile:
          anyOf:
            - $ref: "#/components/schemas/AutomationSchemasSecurityProfile"
            - type: "null"
          description: Security profile governing this organization's automation sessions,
            or null when none applies.
        skills_serve_playbooks:
          default: false
          description: Whether this account uses Skills in place of Playbooks.
          title: Skills Serve Playbooks
          type: boolean
        sources:
          additionalProperties:
            additionalProperties:
              $ref: "#/components/schemas/AutomationEventSchemaResponse"
            type: object
          description: Event source → event name → schema.
          title: Sources
          type: object
        update_semantics:
          description: "PATCH semantics active for this organization: 'replace_groups' (a
            config group present in the request replaces the stored group
            wholesale) or 'merge_patch' (RFC 7396 for objects: omitted members
            of a present group keep their stored values, explicit nulls clear;
            list membership still replaces wholesale — deletion is resending the
            list without the element — but each sent element merges onto the
            stored element of the same type when that type appears exactly once
            on both sides; repeated types must be restated fully). Open enum —
            clients must tolerate new values."
          title: Update Semantics
          type: string
      required:
        - default_net_policy
        - update_semantics
        - sources
      title: AutomationSchemasResponse
      type: object
    AutomationSchemasSecurityProfile:
      additionalProperties: false
      description: |-
        The security profile that governs this organization's automation
        sessions (enterprise, organization, or automations default binding).
      properties:
        governs_network:
          description: Whether the profile has a network policy. When true, sessions are
            already restricted to the profile's destinations and an automation
            needs its own session_settings.net_policy only to restrict further.
          title: Governs Network
          type: boolean
        mcp_servers:
          anyOf:
            - items:
                type: string
              type: array
            - type: "null"
          description: MCP server slugs the profile allows (the ceiling for
            tools.mcp_servers), or null when the profile does not restrict MCP
            servers.
          title: Mcp Servers
        name:
          description: Profile name, for display.
          title: Name
          type: string
      required:
        - name
        - governs_network
        - mcp_servers
      title: AutomationSchemasSecurityProfile
      type: object
    AutomationScriptCheckRequest:
      additionalProperties: false
      description: |-
        The automation's Preflight check configuration. On update the whole
        group is replaced; ``enabled`` alone may be omitted to keep its state.
      properties:
        enabled:
          anyOf:
            - type: boolean
            - type: "null"
          description: Whether the script gates the automation's runs. Omitted keeps the
            current state; a new configuration starts enabled.
          title: Enabled
        runtime:
          description: "Script runtime. One of: python, node, bash."
          title: Runtime
          type: string
        secret_names:
          description: Org secrets exposed to the script as environment variables.
            Requires the manage-org-secrets permission whenever non-empty.
          items:
            type: string
          title: Secret Names
          type: array
        source:
          description: 'The script source (at most 256KB). It reads the trigger event from
            $EVENT_FILE, may read/write a small JSON object at $STATE_FILE that
            persists across runs, and must write its decision to $OUTPUT_FILE:
            {"run": true}, {"run": false, "reason": "..."}, or {"items": [...]}
            (one action run per item).'
          minLength: 1
          title: Source
          type: string
        timeout_seconds:
          default: 60
          description: Wall-clock limit for one run; a run past it fails closed (no
            actions start).
          maximum: 300
          minimum: 1
          title: Timeout Seconds
          type: integer
      required:
        - runtime
        - source
      title: AutomationScriptCheckRequest
      type: object
    AutomationSecurityProfileResponse:
      additionalProperties: false
      properties:
        profile_id:
          anyOf:
            - type: string
            - type: "null"
          title: Profile Id
        selection:
          description: "The automation's own binding: inherit (no binding), none (explicit
            opt-out), or profile (pins profile_id). Sessions resolve the full
            enterprise -> org -> automation chain: the automation's network
            policy only ever narrows the governing profiles' policies, and an
            opt-out cannot escape a mandatory org/enterprise profile."
          enum:
            - inherit
            - none
            - profile
          title: Selection
          type: string
        warnings:
          default: []
          description: Non-blocking configuration conflicts, e.g. a recommended MCP server
            whose endpoint hostname the governing profile blocks (spawned
            sessions will not be able to connect to that server). Only remote
            MCP endpoint hostnames are checked; an empty list does not guarantee
            every MCP or network destination will work. Populated on
            single-automation reads and writes; empty in list responses.
          items:
            type: string
          title: Warnings
          type: array
      required:
        - selection
      title: AutomationSecurityProfileResponse
      type: object
    AutomationSecurityProfileSelection:
      additionalProperties: false
      description: The automation's own security-profile binding.
      properties:
        profile_id:
          anyOf:
            - type: string
            - type: "null"
          description: Security profile to bind to this automation. null records an
            explicit opt-out (no profile, even when the org or enterprise has a
            recommended default). Writing this field requires the
            security-profile management permission; an opt-out cannot escape a
            mandatory org/enterprise profile.
          title: Profile Id
      title: AutomationSecurityProfileSelection
      type: object
    AutomationSessionConfig-Input:
      additionalProperties: false
