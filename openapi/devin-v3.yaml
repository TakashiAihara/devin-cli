    OrgCodeScanCreateRequest:
      description: Request body for starting a new code scan.
      properties:
        board_id:
          anyOf:
            - type: string
            - type: "null"
          description: A finding board made ahead of the scan for it to adopt instead of
            getting a fresh one, so automations could be wired to it before the
            scan existed.
          title: Board Id
        commit_sha:
          anyOf:
            - type: string
            - type: "null"
          description: Commit to check out before scanning.
          title: Commit Sha
        devin_mode:
          anyOf:
            - enum:
                - fusion
                - swe-2
              type: string
            - type: "null"
          description: "Agent the scan's sessions run on: 'fusion' or 'swe-2' (SWE-2 Max
            for 'deep' effort, SWE-2 High for 'normal'). Applies only when the
            mode is enabled for the organization; otherwise, and when omitted,
            the scan runs on the default agent."
          title: Devin Mode
        effort:
          anyOf:
            - enum:
                - normal
                - deep
              type: string
            - type: "null"
          description: "Scan effort: 'normal' (default) uses lower model reasoning effort
            with larger investigation batches; 'deep' runs the full pipeline."
          title: Effort
        host:
          anyOf:
            - type: string
            - type: "null"
          description: Git host of the repository, if known.
          title: Host
        interactive:
          default: false
          description: When true, the scan pauses for user review between threat modeling
            and investigation.
          title: Interactive
          type: boolean
        locale:
          anyOf:
            - type: string
            - type: "null"
          description: "BCP-47 language tag (e.g. 'ja') for the scan's user-facing output:
            finding titles, descriptions, and reports. Omitted means English."
          title: Locale
        new_budget:
          anyOf:
            - $ref: "#/components/schemas/NewScanBudget"
            - type: "null"
          description: Give the scan its own ACU budget. Requires the
            ManageAccountServiceUsers and ManageAcuLimits permissions.
        platform:
          anyOf:
            - maxLength: 128
              type: string
            - type: "null"
          description: "Where the scan's sessions run: a platform label configured for the
            organization (e.g. 'linux', 'windows', 'macos') or the name of an
            outpost (BYOB) pool, case-insensitive; platforms take priority when
            a name matches both. Omitted means the organization default.
            Unrecognized values are rejected with a 400 whose error body lists
            the available platform labels and outpost pool names."
          title: Platform
        profile_id:
          anyOf:
            - type: string
            - type: "null"
          description: Scan profile to apply to the scan.
          title: Profile Id
        repo_name:
          anyOf:
            - type: string
            - type: "null"
          description: Full name of the repository to scan. Provide exactly one of
            repo_name or repos.
          title: Repo Name
        repos:
          anyOf:
            - items:
                $ref: "#/components/schemas/ScanRepoRequest"
              maxItems: 500
              type: array
            - type: "null"
          description: Repositories covered by one scan; the first entry is the scan's
            primary repository. Provide exactly one of repo_name or repos.
          title: Repos
        scan_type:
          anyOf:
            - enum:
                - security
                - performance
                - db-queries
                - test-coverage
                - dead-code
                - code-quality
                - cleanup
                - telemetry
                - accessibility
                - compliance
                - general
                - migration-docs
              type: string
            - type: "null"
          description: Type of scan to run. Must match the profile's scan type when a
            profile is given; defaults to the profile's type, or 'security' for
            profile-less scans. Non-security types require a profile and are
            rejected without one.
          title: Scan Type
      title: OrgCodeScanCreateRequest
      type: object
    OrgDefaultPlatformResponse:
      description: The organization's default placement for new sessions.
      properties:
        outpost_pool_id:
          anyOf:
            - type: string
            - type: "null"
          description: Outpost pool new sessions run on by default. Null when the default
            is a hosted platform or unset.
          title: Outpost Pool Id
        outpost_pool_name:
          anyOf:
            - type: string
            - type: "null"
          description: Name of the default outpost pool. Null when the default is not an
            outpost pool, or the pool is no longer available to the
            organization.
          title: Outpost Pool Name
        platform:
          anyOf:
            - type: string
            - type: "null"
          description: Hosted platform label (e.g. 'linux', 'windows') new sessions run on
            by default. Null when the default is an outpost pool or unset.
          title: Platform
      required:
        - platform
        - outpost_pool_id
        - outpost_pool_name
      title: OrgDefaultPlatformResponse
      type: object
    OrgDefaultPlatformUpdateRequest:
      description: |-
        Set the organization's default placement for new sessions.

        Send at most one of ``platform`` and ``outpost_pool_id``; send both as
        null (for example ``{}``) to clear the default.
      properties:
        outpost_pool_id:
          anyOf:
            - maxLength: 128
              type: string
            - type: "null"
          description: ID of a shared outpost pool available to the organization.
          title: Outpost Pool Id
        platform:
          anyOf:
            - maxLength: 128
              type: string
            - type: "null"
          description: A hosted platform label configured for the organization (e.g.
            'linux', 'windows', 'macos') or the name of a shared outpost pool,
            case-insensitive; platforms take priority when a name matches both.
            Unrecognized values are rejected with a 400 that lists the available
            platforms and outpost pools.
          title: Platform
      title: OrgDefaultPlatformUpdateRequest
      type: object
